name: CartoRig Atomic - OpenFX native adapter

on:
  push:
    branches: [feat/resolve-ofx-integration]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'install/**'
      - '.github/workflows/ofx-package.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'install/**'
      - '.github/workflows/ofx-package.yml'
  workflow_dispatch:

jobs:
  ofx-build:
    name: Native OFX SDK compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned AcademySoftwareFoundation OpenFX SDK
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/openfx
          ref: b2d2eea3a64e511bfabb80e56f902d96adf4a05e
          path: external/openfx
      - name: Configure C++17 core and OpenFX adapter
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCARTORIG_BUILD_OFX=ON
      - name: Compile native effect and core
        run: cmake --build build --config Release --parallel
      - name: Native core, renderer and Inspector session tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify Windows binary has exported OpenFX entry points
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = (Get-ChildItem build -Recurse -Filter "CartoRigAtomic.ofx" | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Missing native OpenFX adapter binary' }
          $dll = [System.Runtime.InteropServices.NativeLibrary]::Load($binary)
          try {
            foreach ($symbol in @('OfxGetNumberOfPlugins','OfxGetPlugin')) {
              $pointer = [System.Runtime.InteropServices.NativeLibrary]::GetExport($dll, $symbol)
              if ($pointer -eq [IntPtr]::Zero) { throw "Missing OpenFX ABI symbol $symbol" }
              Write-Host "Validated native export $symbol"
            }
          } finally { [System.Runtime.InteropServices.NativeLibrary]::Free($dll) }
      - name: Upload Windows native module
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Atomic-Native-OFX-Win64
          path: build/Release/CartoRigAtomic.ofx
          if-no-files-found: error
      - name: Upload Linux test binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Atomic-Native-OFX-Linux64-Experimental
          path: build/CartoRigAtomic.ofx
          if-no-files-found: error

  offline-catalog:
    name: Verified Natural Earth data pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare offline geographic data (build environment only)
        run: |
          python -m pip install -r tools/requirements-build.txt
          python tools/build_natural_earth.py --output dist/data/cartorig-natural-earth-10m.catalog
      - name: Compile real geographic acceptance probe
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Verify Rio/SP/Brasília/Macapá in actual geographic data
        run: ./build/cartorig_real_scenario_probe dist/data/cartorig-natural-earth-10m.catalog
      - name: Upload catalog and SHA256 source manifest
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Atomic-NaturalEarth-10m
          path: dist/data/
          if-no-files-found: error

  windows-installer:
    name: One-click Windows installer and OFX bundle
    runs-on: windows-latest
    needs: [ofx-build, offline-catalog]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: CartoRig-Atomic-Native-OFX-Win64
          path: dist/native
      - uses: actions/download-artifact@v4
        with:
          name: CartoRig-Atomic-NaturalEarth-10m
          path: dist/data
      - name: Verify artifact files and assemble standard OFX bundle
        shell: pwsh
        run: |
          $binary = (Get-ChildItem dist/native -Recurse -Filter "CartoRigAtomic.ofx" | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Missing OpenFX native binary artifact' }
          python tools/package_ofx.py --binary "$binary" --catalog dist/data/cartorig-natural-earth-10m.catalog --manifest dist/data/natural-earth-manifest.json --destination dist
      - name: Install Inno Setup compiler on CI runner (not on editor computer)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler unavailable' }
      - name: Build graphical Windows setup EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' install/CartoRigAtomic.iss
      - name: Upload one-click installer
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Atomic-Windows-Installer
          path: dist/installer/CartoRig-Atomic-Windows-x64-Setup.exe
          if-no-files-found: error
      - name: Upload OFX bundle ZIP for debugging only
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Atomic-Windows-OFX-Bundle
          path: dist/CartoRig-Atomic-OFX-Windows-x64.zip
          if-no-files-found: error
