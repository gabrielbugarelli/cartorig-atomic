name: CartoRig Atomic - native geographic core

on:
  push:
    branches:
      - feat/offline-cartographic-core
    paths:
      - 'src/core/**'
      - 'tools/build_natural_earth.py'
      - 'tools/catalog_probe.cpp'
      - 'tools/requirements-build.txt'
      - 'tests/core_tests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/geo-core.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'tools/build_natural_earth.py'
      - 'tools/catalog_probe.cpp'
      - 'tools/requirements-build.txt'
      - 'tests/core_tests.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/geo-core.yml'
  workflow_dispatch:

jobs:
  native-core:
    name: Portable C++17 core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable native core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile core and tests
        run: cmake --build build --config Release --parallel
      - name: Run 3 product scenario tests
        run: ctest --test-dir build -C Release --output-on-failure

  official-offline-catalog:
    name: Build official Natural Earth 10m offline pack
    needs: native-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data-build dependency (not an editor requirement)
        run: python -m pip install -r tools/requirements-build.txt
      - name: Download official Natural Earth 10m and assemble offline catalog
        run: python tools/build_natural_earth.py --output dist/data/cartorig-natural-earth-10m.catalog
      - name: Build native catalog diagnostics
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Verify real RJ/SP/Brasilia/Amapa type and geometry coverage
        run: ./build/cartorig_catalog_probe --catalog dist/data/cartorig-natural-earth-10m.catalog --smoke
      - name: Upload offline catalog and source provenance for downstream packaging
        uses: actions/upload-artifact@v4
        with:
          name: CartoRig-Atomic-NaturalEarth-Offline-Catalog
          path: |
            dist/data/cartorig-natural-earth-10m.catalog
            dist/data/natural-earth-manifest.json
          if-no-files-found: error
